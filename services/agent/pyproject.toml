[project]
name = "daastaan-agent"
version = "0.1.0"
description = "LangGraph agent service and Celery workers: reasoning stages, TTS, images, ffmpeg assembly."
requires-python = ">=3.12,<3.13"
dependencies = [
    "daastaan-contracts",
    "daastaan-common",
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.38.0",
    "langgraph>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "openai>=2.9.0",
    "httpx>=0.28.0",
    "tenacity>=9.1.0",
    # Client-only MLflow. The full package pulls in the tracking server and UI,
    # which a worker never needs.
    "mlflow-skinny>=3.6.0",
    "langfuse>=3.9.0",
    # Queue visibility during the build: docker compose --profile tools up flower
    "flower>=2.0.1",
    # Document ingest. Permissive licences only - PyMuPDF would collapse pypdf,
    # pdf2image and poppler into one dependency but it is AGPL.
    "pypdf>=6.1.0",
    "python-docx>=1.2.0",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "pillow>=11.4.0",
    "charset-normalizer>=3.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daastaan_agent"]
