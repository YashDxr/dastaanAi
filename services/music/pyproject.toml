[project]
name = "daastaan-music"
version = "0.1.0"
description = "Private native macOS Stable Audio MLX sidecar for Dastaan background music."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.38.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daastaan_music"]
