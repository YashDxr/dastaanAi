[project]
name = "daastaan-api"
version = "0.1.0"
description = "Main FastAPI backend: auth, stories, feedback, media streaming, admin."
requires-python = ">=3.12,<3.13"
dependencies = [
    "daastaan-contracts",
    "daastaan-common",
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.38.0",
    "pyjwt>=2.10.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "python-multipart>=0.0.20",
    "websockets>=15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daastaan_api"]
