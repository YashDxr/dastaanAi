[project]
name = "daastaan-contracts"
version = "0.1.0"
description = "Shared Pydantic contracts for the Daastaan pipeline. Dependency-light on purpose."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daastaan_contracts"]
