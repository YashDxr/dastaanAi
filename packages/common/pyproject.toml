[project]
name = "daastaan-common"
version = "0.1.0"
description = "Shared infrastructure: settings, database, object storage, logging, Celery app."
requires-python = ">=3.12,<3.13"
dependencies = [
    "daastaan-contracts",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.11.0",
    "sqlmodel>=0.0.27",
    "sqlalchemy>=2.0.44",
    "psycopg[binary]>=3.2.10",
    "celery[redis]>=5.6.0",
    "redis>=6.4.0",
    "structlog>=25.4.0",
    "databricks-sdk>=0.71.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daastaan_common"]
